# Reusable build/test steps template for Autoruns for Linux.
#
# Modeled on the Sysinternals-jcd `templates/build.yaml` pattern: the caller
# passes the source path and optional runtime library path, and this template
# builds the Rust binary. It additionally runs formatting, lint, and test steps
# so the shared pipeline validates the crate end to end.

parameters:
- name: srcPath
  type: string
  default: '.'
- name: runStaticAnalysis
  type: boolean
  default: true
- name: ldpath
  type: string
  default: ''

steps:
- script: |
    set -euo pipefail

    if [ -n "${{ parameters.ldpath }}" ]; then
        export LD_LIBRARY_PATH="${{ parameters.ldpath }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    fi

    # Hosted ubuntu images ship rustup. Fail fast if it is missing rather than
    # piping a remote install script into a shell, which is a CI supply-chain
    # risk. rustup then reads the in-repo rust-toolchain.toml and installs the
    # pinned toolchain and components on the first cargo invocation, keeping
    # builds reproducible.
    if ! command -v rustup >/dev/null 2>&1; then
        echo "rustup not found on the build image. Install rustup (or add a pinned, checksum-verified rustup-init step) before running this pipeline." >&2
        exit 1
    fi
    . "$HOME/.cargo/env" 2>/dev/null || true

    rustc --version
    cargo --version

    cd "${{ parameters.srcPath }}"
    cargo build --release
  displayName: "Build autoruns"

- ${{ if eq(parameters.runStaticAnalysis, true) }}:
  - script: |
      set -euo pipefail
      . "$HOME/.cargo/env" 2>/dev/null || true

      cd "${{ parameters.srcPath }}"
      rustup component add rustfmt clippy
      cargo fmt --all -- --check
      cargo clippy --all-targets -- -D warnings
    displayName: "Static analysis (fmt + clippy)"

- script: |
    set -euo pipefail
    . "$HOME/.cargo/env" 2>/dev/null || true

    cd "${{ parameters.srcPath }}"
    cargo test --all
  displayName: "Test autoruns"
