# Reusable build/test steps template for Autoruns for Linux.
#
# Modeled on the Sysinternals-jcd `templates/build.yaml` pattern: the caller
# passes the source path and optional runtime library path, and this template
# builds the Rust binary. It additionally runs formatting, lint, and test steps
# so the shared pipeline validates the crate end to end.

parameters:
- name: srcPath
  type: string
  default: '.'
- name: runStaticAnalysis
  type: boolean
  default: true
- name: ldpath
  type: string
  default: ''

steps:
- script: |
    set -euo pipefail

    if [ -n "${{ parameters.ldpath }}" ]; then
        export LD_LIBRARY_PATH="${{ parameters.ldpath }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    fi

    # Hosted ubuntu images ship rustup. Fail fast if it is missing rather than
    # piping a remote install script into a shell, which is a CI supply-chain
    # risk. rustup then reads the in-repo rust-toolchain.toml and installs the
    # pinned toolchain and components on the first cargo invocation, keeping
    # builds reproducible.
    if ! command -v rustup >/dev/null 2>&1; then
        echo "rustup not found on the build image. Install rustup (or add a pinned, checksum-verified rustup-init step) before running this pipeline." >&2
        exit 1
    fi
    . "$HOME/.cargo/env" 2>/dev/null || true

    # rustup being present does not guarantee the toolchain binaries are on
    # PATH (partial install, or a missing $HOME/.cargo/env). Check explicitly so
    # the failure is actionable rather than a bare "command not found".
    if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
        echo "cargo/rustc are not on PATH after loading the rustup environment; verify the toolchain installation." >&2
        exit 1
    fi

    rustc --version
    cargo --version

    cd "${{ parameters.srcPath }}"
    cargo build --release
  displayName: "Build autoruns"

- ${{ if eq(parameters.runStaticAnalysis, true) }}:
  - script: |
      set -euo pipefail
      . "$HOME/.cargo/env" 2>/dev/null || true

      # Each Azure DevOps script step runs in a fresh shell, so re-verify the
      # toolchain is on PATH here too; otherwise fmt/clippy can fail with a bare
      # "command not found" even when the build step passed.
      if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
          echo "cargo/rustc are not on PATH after loading the rustup environment; verify the toolchain installation." >&2
          exit 1
      fi

      cd "${{ parameters.srcPath }}"
      rustup component add rustfmt clippy
      cargo fmt --all -- --check
      cargo clippy --all-targets -- -D warnings
    displayName: "Static analysis (fmt + clippy)"

- script: |
    set -euo pipefail
    . "$HOME/.cargo/env" 2>/dev/null || true

    # Fresh shell for this step: re-verify the toolchain is on PATH so a missing
    # $HOME/.cargo/env yields an actionable error instead of "command not found".
    if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
        echo "cargo/rustc are not on PATH after loading the rustup environment; verify the toolchain installation." >&2
        exit 1
    fi

    cd "${{ parameters.srcPath }}"
    cargo test --all
  displayName: "Test autoruns"
