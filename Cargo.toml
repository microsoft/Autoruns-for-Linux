[package]
name = "autoruns"
version = "0.1.0-rc.1"
edition = "2021"
description = "List Linux autorun and persistence entries"
license = "MIT"

[[bin]]
name = "autoruns"
path = "src/main.rs"

[dependencies]
glob = "0.3"
quick-xml = "0.38"
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1