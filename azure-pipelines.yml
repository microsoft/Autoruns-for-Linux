# Azure build pipeline for Sysinternals Autoruns for Linux.
#
# Follows the Sysinternals-jcd pipeline pattern: a thin top-level pipeline that
# checks out the pull-request commit (`self`) and delegates the build/test work
# to a reusable template.

trigger:
  branches:
    include:
      - release/*
      - main
    exclude:
      - dev/*
      - test/*

pr:
- main

stages:
- stage: "Build"
  jobs:
  - job: "Build_autoruns_24_04"
    pool:
      vmImage: "ubuntu-24.04"
    steps:
    - checkout: self
      persistCredentials: true

    - template: templates/build.yaml
      parameters:
        srcPath: '.'
