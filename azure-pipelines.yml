# Azure build pipeline for Sysinternals Autoruns for Linux.
#
# Follows the Sysinternals-jcd pipeline pattern: a thin top-level pipeline that
# checks out the current commit (`self`) and delegates the build/test work to a
# reusable template.
#
# During the initial implementation this pipeline is scoped to the fork's
# working branch (initial-rust-implementation): `checkout: self` builds whichever
# repository the pipeline is attached to (the fork), and the CI trigger below
# runs on every push to that branch so issues can be resolved without opening a
# pull request. PR triggers are disabled for the same reason.

trigger:
  branches:
    include:
      - initial-rust-implementation
    exclude:
      - dev/*
      - test/*

pr: none

stages:
- stage: "Build"
  jobs:
  - job: "Build_autoruns_24_04"
    pool:
      vmImage: "ubuntu-24.04"
    steps:
    - checkout: self
      persistCredentials: true

    - template: templates/build.yaml
      parameters:
        srcPath: '.'

    - script: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu \
          libc6-dev-arm64-cross
        rustup target add aarch64-unknown-linux-gnu

        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        cargo build --release --target aarch64-unknown-linux-gnu
      displayName: "Build autoruns for ARM64"
